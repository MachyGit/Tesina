<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panel Profesor — Campus Virtual</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --azul:#1a3a6b; --azul2:#2256a8; --acento:#e8a020; --claro:#f5f7fa; --texto:#1c1c2e; --gris:#6b7280; --sidebar:240px; }
    body { font-family:'DM Sans',sans-serif; background:var(--claro); display:flex; min-height:100vh; }
    .sidebar { width:var(--sidebar); background:#15803d; color:#fff; display:flex; flex-direction:column; position:fixed; top:0; left:0; bottom:0; z-index:50; }
    .sidebar-logo { padding:28px 24px 20px; font-family:'Playfair Display',serif; font-size:1.1rem; border-bottom:1px solid rgba(255,255,255,.1); }
    .sidebar-logo span { color:#86efac; }
    .sidebar-rol { padding:12px 24px; font-size:.75rem; letter-spacing:2px; text-transform:uppercase; opacity:.5; border-bottom:1px solid rgba(255,255,255,.08); }
    .sidebar-nav { flex:1; padding:16px 0; }
    .nav-item { display:flex; align-items:center; gap:12px; padding:13px 24px; color:rgba(255,255,255,.75); cursor:pointer; transition:all .2s; font-size:.92rem; border-left:3px solid transparent; }
    .nav-item:hover, .nav-item.active { background:rgba(255,255,255,.1); color:#fff; border-left-color:#86efac; }
    .nav-item .icon { font-size:1.1rem; width:22px; }
    .sidebar-footer { padding:20px 24px; border-top:1px solid rgba(255,255,255,.1); }
    .btn-logout { display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.08); border:none; color:#fff; padding:11px 16px; border-radius:8px; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:.88rem; width:100%; }
    .main { margin-left:var(--sidebar); flex:1; display:flex; flex-direction:column; }
    .topbar { background:#fff; padding:18px 36px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 1px 12px rgba(0,0,0,.06); position:sticky; top:0; z-index:40; }
    .topbar-title { font-family:'Playfair Display',serif; font-size:1.3rem; color:var(--texto); }
    .topbar-user { display:flex; align-items:center; gap:10px; font-size:.88rem; color:var(--gris); }
    .avatar { width:36px; height:36px; border-radius:50%; background:#15803d; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:.9rem; }
    .content { padding:32px 36px; flex:1; }
    .tabs { display:flex; gap:4px; margin-bottom:28px; background:#fff; padding:6px; border-radius:10px; box-shadow:0 1px 8px rgba(0,0,0,.06); width:fit-content; }
    .tab { padding:9px 20px; border-radius:7px; border:none; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:.88rem; font-weight:500; color:var(--gris); background:transparent; transition:all .2s; }
    .tab.active { background:#15803d; color:#fff; }
    .panel { display:none; }
    .panel.active { display:block; }
    .card { background:#fff; border-radius:12px; padding:24px; box-shadow:0 1px 8px rgba(0,0,0,.06); margin-bottom:20px; }
    .card-title { font-weight:600; font-size:1rem; color:var(--texto); margin-bottom:18px; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .field { display:flex; flex-direction:column; gap:5px; }
    .field.full { grid-column:1/-1; }
    label { font-size:.82rem; font-weight:600; color:var(--texto); }
    input, select, textarea { padding:11px 14px; border:1.5px solid #e5e7eb; border-radius:8px; font-family:'DM Sans',sans-serif; font-size:.92rem; color:var(--texto); background:var(--claro); outline:none; }
    input:focus, select:focus, textarea:focus { border-color:#15803d; }
    textarea { resize:vertical; min-height:100px; }
    .btn { padding:11px 22px; border-radius:8px; border:none; font-family:'DM Sans',sans-serif; font-weight:600; font-size:.9rem; cursor:pointer; }
    .btn-primary { background:#15803d; color:#fff; }
    .btn-primary:hover { background:#16a34a; }
    .aviso-card { border:1px solid #f0f0f0; border-radius:10px; padding:16px 18px; margin-bottom:12px; }
    .badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:.75rem; font-weight:600; }
    .badge-tarea { background:#dcfce7; color:#16a34a; }
    .badge-general { background:#e0e7ff; color:#4338ca; }
    .empty { text-align:center; padding:48px; color:var(--gris); }
    .empty-icon { font-size:2.5rem; margin-bottom:12px; }
    @media(max-width:900px) { .sidebar{display:none} .main{margin-left:0} .content{padding:20px 16px} .topbar{padding:14px 20px} .form-grid{grid-template-columns:1fr} }
  </style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo">Campus <span>Virtual</span></div>
  <div class="sidebar-rol">🟢 Profesor</div>
  <nav class="sidebar-nav">
    <div class="nav-item active" onclick="showTab('tareas')"><span class="icon">📚</span> Mis Tareas</div>
    <div class="nav-item" onclick="showTab('avisos')"><span class="icon">📢</span> Avisos</div>
  </nav>
  <div class="sidebar-footer">
    <button class="btn-logout" onclick="logout()">🚪 Cerrar sesión</button>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-title">Panel Profesor</div>
    <div class="topbar-user">
      <div class="avatar" id="avatarInitial">P</div>
      <span id="userName">Profesor</span>
    </div>
  </div>
  <div class="content">
    <div class="tabs">
      <button class="tab active" onclick="showTab('tareas')">📚 Mis Tareas</button>
      <button class="tab" onclick="showTab('avisos')">📢 Avisos</button>
    </div>

    <div class="panel active" id="panel-tareas">
      <div class="card">
        <div class="card-title">Publicar nueva tarea</div>
        <div class="form-grid">
          <div class="field"><label>Título de la tarea</label><input type="text" id="tareaTitulo" placeholder="Ej: Ejercicios pág. 45"/></div>
          <div class="field"><label>Tipo</label>
            <select id="tareaTipo">
              <option value="tarea">📚 Tarea</option>
              <option value="general">📣 Aviso general</option>
            </select>
          </div>
          <div class="field full"><label>Descripción</label><textarea id="tareaContenido" placeholder="Detallá la tarea..."></textarea></div>
          <div class="field full"><button class="btn btn-primary" onclick="publicarTarea()">📤 Publicar</button></div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Tareas publicadas</div>
        <div id="listaTareas"><div class="empty"><div class="empty-icon">📚</div>Cargando...</div></div>
      </div>
    </div>

    <div class="panel" id="panel-avisos">
      <div class="card">
        <div class="card-title">Todos los avisos</div>
        <div id="listaAvisos"><div class="empty"><div class="empty-icon">📭</div>Cargando...</div></div>
      </div>
    </div>
  </div>
</div>

<script src="base.js"></script>
<script>
  const user = getUser();
  if (user) {
    document.getElementById('userName').textContent = user.nombre;
    document.getElementById('avatarInitial').textContent = user.nombre[0].toUpperCase();
  }

  function showTab(tab) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('panel-' + tab).classList.add('active');
    document.querySelectorAll('.tab').forEach(t => { if(t.textContent.toLowerCase().includes(tab)) t.classList.add('active'); });
    if (tab === 'avisos') cargarAvisos();
    if (tab === 'tareas') cargarTareas();
  }

  async function publicarTarea() {
    const titulo    = document.getElementById('tareaTitulo').value.trim();
    const contenido = document.getElementById('tareaContenido').value.trim();
    const tipo      = document.getElementById('tareaTipo').value;
    if (!titulo || !contenido) return alert('Completá todos los campos');
    await apiFetch('/api/avisos', { method:'POST', body: JSON.stringify({ titulo, contenido, tipo }) });
    document.getElementById('tareaTitulo').value = '';
    document.getElementById('tareaContenido').value = '';
    cargarTareas();
  }

  async function cargarTareas() {
    const data = await apiFetch('/api/avisos');
    const mias = data.filter(a => a.autor_id === user.id);
    const el = document.getElementById('listaTareas');
    if (!mias.length) { el.innerHTML = '<div class="empty"><div class="empty-icon">📚</div>No publicaste tareas aún</div>'; return; }
    el.innerHTML = mias.map(a => `
      <div class="aviso-card">
        <span class="badge badge-${a.tipo}">${a.tipo.toUpperCase()}</span>
        <div style="margin-top:8px;font-weight:600">${a.titulo}</div>
        <div style="color:var(--gris);font-size:.88rem;margin-top:4px">${a.contenido}</div>
        <small style="color:#9ca3af">${formatFecha(a.fecha)}</small>
      </div>
    `).join('');
  }

  async function cargarAvisos() {
    const data = await apiFetch('/api/avisos');
    const el = document.getElementById('listaAvisos');
    if (!data.length) { el.innerHTML = '<div class="empty"><div class="empty-icon">📭</div>Sin avisos</div>'; return; }
    el.innerHTML = data.map(a => `
      <div style="padding:14px 0;border-bottom:1px solid #f0f0f0">
        <strong>${a.titulo}</strong>
        <p style="color:var(--gris);font-size:.88rem;margin-top:4px">${a.contenido}</p>
        <small style="color:#9ca3af">${formatFecha(a.fecha)} · ${a.autor}</small>
      </div>
    `).join('');
  }

  // Dashboard Secretaria (redirige al director con permisos limitados)
  cargarTareas();
</script>
</body>
</html>
