<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mi Campus — Alumno</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --azul:#1a3a6b; --azul2:#2256a8; --acento:#e8a020; --claro:#f5f7fa; --texto:#1c1c2e; --gris:#6b7280; --sidebar:240px; }
    body { font-family:'DM Sans',sans-serif; background:var(--claro); display:flex; min-height:100vh; }
    .sidebar { width:var(--sidebar); background:var(--azul); color:#fff; display:flex; flex-direction:column; position:fixed; top:0; left:0; bottom:0; z-index:50; }
    .sidebar-logo { padding:28px 24px 20px; font-family:'Playfair Display',serif; font-size:1.1rem; border-bottom:1px solid rgba(255,255,255,.1); }
    .sidebar-logo span { color:var(--acento); }
    .sidebar-rol { padding:12px 24px; font-size:.75rem; letter-spacing:2px; text-transform:uppercase; opacity:.5; border-bottom:1px solid rgba(255,255,255,.08); }
    .sidebar-nav { flex:1; padding:16px 0; }
    .nav-item { display:flex; align-items:center; gap:12px; padding:13px 24px; color:rgba(255,255,255,.75); cursor:pointer; transition:all .2s; font-size:.92rem; border-left:3px solid transparent; }
    .nav-item:hover, .nav-item.active { background:rgba(255,255,255,.08); color:#fff; border-left-color:var(--acento); }
    .nav-item .icon { font-size:1.1rem; width:22px; }
    .sidebar-footer { padding:20px 24px; border-top:1px solid rgba(255,255,255,.1); }
    .btn-logout { display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.08); border:none; color:#fff; padding:11px 16px; border-radius:8px; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:.88rem; width:100%; transition:background .2s; }
    .btn-logout:hover { background:rgba(255,255,255,.15); }
    .main { margin-left:var(--sidebar); flex:1; display:flex; flex-direction:column; min-height:100vh; }
    .topbar { background:#fff; padding:18px 36px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 1px 12px rgba(0,0,0,.06); position:sticky; top:0; z-index:40; }
    .topbar-title { font-family:'Playfair Display',serif; font-size:1.3rem; color:var(--texto); }
    .topbar-user { display:flex; align-items:center; gap:10px; font-size:.88rem; color:var(--gris); }
    .avatar { width:36px; height:36px; border-radius:50%; background:var(--acento); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:.9rem; }
    .content { padding:32px 36px; flex:1; }
    .tabs { display:flex; gap:4px; margin-bottom:28px; background:#fff; padding:6px; border-radius:10px; box-shadow:0 1px 8px rgba(0,0,0,.06); width:fit-content; }
    .tab { padding:9px 20px; border-radius:7px; border:none; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:.88rem; font-weight:500; color:var(--gris); background:transparent; transition:all .2s; }
    .tab.active { background:var(--azul); color:#fff; }
    .panel { display:none; }
    .panel.active { display:block; }
    .card { background:#fff; border-radius:12px; padding:24px; box-shadow:0 1px 8px rgba(0,0,0,.06); margin-bottom:20px; }
    .card-title { font-weight:600; font-size:1rem; color:var(--texto); margin-bottom:18px; }
    .badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:.75rem; font-weight:600; }
    .badge-general { background:#e0e7ff; color:#4338ca; }
    .badge-tarea { background:#dcfce7; color:#16a34a; }
    .badge-horario { background:#fef3c7; color:#b45309; }
    .badge-urgente { background:#fee2e2; color:#dc2626; }
    .aviso-card { border:1px solid #f0f0f0; border-radius:10px; padding:16px 18px; margin-bottom:12px; }
    .aviso-meta { display:flex; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
    .aviso-titulo { font-weight:600; font-size:.95rem; margin-bottom:6px; }
    .aviso-body { color:var(--gris); font-size:.88rem; line-height:1.6; }
    .aviso-fecha { font-size:.78rem; color:var(--gris); margin-left:auto; }
    .empty { text-align:center; padding:48px; color:var(--gris); }
    .empty-icon { font-size:2.5rem; margin-bottom:12px; }
    .asistencia-grid { display:grid; gap:8px; }
    .asistencia-item { display:flex; align-items:center; gap:12px; padding:12px 16px; border:1px solid #f0f0f0; border-radius:8px; font-size:.88rem; }
    .asist-estado { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
    .presente { background:#16a34a; }
    .ausente  { background:#dc2626; }
    .tarde    { background:#f59e0b; }
    .bienvenida { background:linear-gradient(135deg, var(--azul) 0%, var(--azul2) 100%); border-radius:14px; padding:28px 32px; color:#fff; margin-bottom:24px; }
    .bienvenida h2 { font-family:'Playfair Display',serif; font-size:1.6rem; margin-bottom:6px; }
    .bienvenida p { opacity:.8; font-size:.92rem; }
    @media(max-width:900px) { .sidebar{display:none} .main{margin-left:0} .content{padding:20px 16px} .topbar{padding:14px 20px} }
  </style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo">Campus <span>Virtual</span></div>
  <div class="sidebar-rol">🟡 Alumno</div>
  <nav class="sidebar-nav">
    <div class="nav-item active" onclick="showTab('inicio')"><span class="icon">🏠</span> Inicio</div>
    <div class="nav-item" onclick="showTab('avisos')"><span class="icon">📢</span> Avisos</div>
    <div class="nav-item" onclick="showTab('tareas')"><span class="icon">📚</span> Tareas</div>
    <div class="nav-item" onclick="showTab('asistencia')"><span class="icon">✅</span> Asistencia</div>
  </nav>
  <div class="sidebar-footer">
    <button class="btn-logout" onclick="logout()">🚪 Cerrar sesión</button>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-title" id="pageTitle">Mi Campus</div>
    <div class="topbar-user">
      <div class="avatar" id="avatarInitial">A</div>
      <span id="userName">Alumno</span>
    </div>
  </div>
  <div class="content">
    <div class="tabs">
      <button class="tab active" onclick="showTab('inicio')">🏠 Inicio</button>
      <button class="tab" onclick="showTab('avisos')">📢 Avisos</button>
      <button class="tab" onclick="showTab('tareas')">📚 Tareas</button>
      <button class="tab" onclick="showTab('asistencia')">✅ Asistencia</button>
    </div>

    <div class="panel active" id="panel-inicio">
      <div class="bienvenida">
        <h2>¡Bienvenido, <span id="welcomeName">alumno</span>! 👋</h2>
        <p>Desde acá podés ver tus avisos, tareas y asistencia.</p>
      </div>
      <div class="card">
        <div class="card-title">📢 Últimos avisos</div>
        <div id="ultimosAvisos"><div class="empty"><div class="empty-icon">📭</div>Cargando...</div></div>
      </div>
    </div>

    <div class="panel" id="panel-avisos">
      <div class="card">
        <div class="card-title">Todos los avisos</div>
        <div id="todosAvisos"><div class="empty"><div class="empty-icon">📭</div>Cargando...</div></div>
      </div>
    </div>

    <div class="panel" id="panel-tareas">
      <div class="card">
        <div class="card-title">Tareas asignadas</div>
        <div id="listaTareas"><div class="empty"><div class="empty-icon">📚</div>Cargando...</div></div>
      </div>
    </div>

    <div class="panel" id="panel-asistencia">
      <div class="card">
        <div class="card-title">Mi asistencia</div>
        <div id="miAsistencia"><div class="empty"><div class="empty-icon">✅</div>Cargando...</div></div>
      </div>
    </div>
  </div>
</div>

<script src="base.js"></script>
<script>
  const user = getUser();
  if (user) {
    document.getElementById('userName').textContent = user.nombre;
    document.getElementById('welcomeName').textContent = user.nombre.split(' ')[0];
    document.getElementById('avatarInitial').textContent = user.nombre[0].toUpperCase();
  }

  function showTab(tab) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('panel-' + tab).classList.add('active');
    document.querySelectorAll('.tab').forEach(t => { if(t.textContent.toLowerCase().includes(tab)) t.classList.add('active'); });
    if (tab === 'avisos' || tab === 'tareas') cargarAvisos(tab);
    if (tab === 'asistencia') cargarAsistencia();
  }

  function renderAvisos(data) {
    if (!data.length) return '<div class="empty"><div class="empty-icon">📭</div>No hay avisos</div>';
    return data.map(a => `
      <div class="aviso-card">
        <div class="aviso-meta">
          <span class="badge badge-${a.tipo}">${a.tipo.toUpperCase()}</span>
          <span style="font-size:.82rem;color:var(--gris)">Por: ${a.autor}</span>
          <span class="aviso-fecha">${formatFecha(a.fecha)}</span>
        </div>
        <div class="aviso-titulo">${a.titulo}</div>
        <div class="aviso-body">${a.contenido}</div>
      </div>
    `).join('');
  }

  async function cargarAvisos(filtro) {
    const data = await apiFetch('/api/avisos');
    document.getElementById('ultimosAvisos').innerHTML = renderAvisos(data.slice(0,3));
    if (filtro === 'avisos') {
      document.getElementById('todosAvisos').innerHTML = renderAvisos(data.filter(a => a.tipo !== 'tarea'));
    }
    if (filtro === 'tareas') {
      const tareas = data.filter(a => a.tipo === 'tarea');
      document.getElementById('listaTareas').innerHTML = renderAvisos(tareas);
    }
  }

  async function cargarAsistencia() {
    const data = await apiFetch('/api/asistencia/' + user.id);
    const el = document.getElementById('miAsistencia');
    if (!data.length) { el.innerHTML = '<div class="empty"><div class="empty-icon">✅</div>Sin registros</div>'; return; }
    el.innerHTML = '<div class="asistencia-grid">' + data.map(a => `
      <div class="asistencia-item">
        <div class="asist-estado ${a.estado}"></div>
        <span><strong>${new Date(a.fecha).toLocaleDateString('es-AR')}</strong></span>
        <span style="color:var(--gris)">${a.estado.charAt(0).toUpperCase() + a.estado.slice(1)}</span>
      </div>
    `).join('') + '</div>';
  }

  cargarAvisos();
</script>
</body>
</html>
