<!DOCTYPE html>
<html lang="es">
<head>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="login.CSS">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Restablecer contraseña — Campus Virtual</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
</head>
<body>
<div class="left"><div class="left-content"><div class="left-logo">Campus <span>Virtual</span></div>
  <p class="left-sub">Elegí una contraseña nueva para tu cuenta.</p></div></div>
<div class="right"><div class="card">
  <h1>Nueva contraseña</h1>
  <p class="subtitle" id="sub">Escribí la contraseña que quieras usar de ahora en más.</p>
  <div class="msg msg-error" id="error"></div>
  <div class="msg msg-success" id="exito"></div>
  <div class="form active" id="form" style="display:block">
    <div class="field"><label>Nueva contraseña</label>
      <div class="input-wrap"><span class="input-icon">🔒</span><input type="password" id="p1" placeholder="Mínimo 8 caracteres" autocomplete="new-password"/></div></div>
    <div class="field"><label>Repetila</label>
      <div class="input-wrap"><span class="input-icon">🔒</span><input type="password" id="p2" placeholder="Repetí la contraseña" autocomplete="new-password"/></div></div>
    <button class="btn-submit green" id="btn">Guardar contraseña</button>
  </div>
  <p style="margin-top:18px"><a class="back-link" href="login.html">← Ir a iniciar sesión</a></p>
</div></div>
<script>
const BACK = window.BACKEND_URL || (location.port === '3000' ? `${location.protocol}//${location.hostname}:5000` : location.origin);
const token = new URLSearchParams(location.search).get('token');
const $ = (i) => document.getElementById(i);
const msg = (k, t) => { $('error').style.display = $('exito').style.display = 'none'; if (k) { $(k).textContent = t; $(k).style.display = 'block'; } };
if (!token) { $('form').style.display = 'none'; msg('error', 'El enlace no es válido. Pedí uno nuevo desde “¿Olvidaste tu contraseña?”.'); }
$('btn').addEventListener('click', async () => {
  const a = $('p1').value, b = $('p2').value;
  if (a.length < 8) return msg('error', 'La contraseña debe tener al menos 8 caracteres.');
  if (a !== b) return msg('error', 'Las contraseñas no coinciden.');
  $('btn').disabled = true;
  try {
    const r = await fetch(BACK + '/api/auth/reset-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, passwordNueva: a }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { $('btn').disabled = false; return msg('error', d.error || 'No se pudo cambiar la contraseña.'); }
    $('form').style.display = 'none'; msg('exito', d.message + ' Redirigiendo…');
    setTimeout(() => (location.href = 'login.html'), 2500);
  } catch { $('btn').disabled = false; msg('error', 'No se pudo conectar con el servidor.'); }
});
</script>
</body></html>
